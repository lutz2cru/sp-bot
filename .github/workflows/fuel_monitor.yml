name: Fuel Monitor 24-7

on:
  schedule:
    # Exécution automatique de secours par le cron GitHub
    - cron: '*/5 * * * *'
  # Permet également de lancer manuellement depuis l'interface GitHub ou via API
  workflow_dispatch:
  repository_dispatch:
    types: [check-fuel]

concurrency:
  group: fuel-monitor
  cancel-in-progress: true

jobs:
  check-fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vérification des stations et envoi alerte Ntfy
        run: |
          python -u main.py check

      - name: Sauvegarde de l'état des stocks
        run: |
          git config --global user.name "SP-Bot Cloud Runner"
          git config --global user.email "sp-bot@github-actions.local"
          git add data/state.json
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour état des stations [skip ci]"
            git push || true
          else
            echo "Aucun changement d'état à archiver."
          fi
