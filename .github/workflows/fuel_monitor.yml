name: Fuel Monitor 24-7

on:
  schedule:
    # Exécution automatique toutes les 5 minutes (fréquence maximale autorisée par GitHub)
    - cron: '*/5 * * * *'
  # Permet également de lancer manuellement depuis l'interface GitHub
  workflow_dispatch:

concurrency:
  group: fuel-monitor
  cancel-in-progress: false

jobs:
  check-fuel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vérification des stations et envoi alerte Ntfy
        run: |
          python main.py check

      - name: Sauvegarde de l'état des stocks
        run: |
          git config --global user.name "SP-Bot Cloud Runner"
          git config --global user.email "sp-bot@github-actions.local"
          git add data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour état des stations [skip ci]" && git push)
