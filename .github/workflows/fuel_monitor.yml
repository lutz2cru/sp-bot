name: Fuel Monitor 24-7

on:
  schedule:
    # Exécution automatique toutes les 10 minutes (24h/24, 7j/7)
    - cron: '*/10 * * * *'
  # Permet également de lancer manuellement depuis l'interface GitHub
  workflow_dispatch:

concurrency:
  group: fuel-monitor
  cancel-in-progress: false

jobs:
  check-fuel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vérification des stations et alertes
        env:
          # Configuration E-mail (Secrets GitHub)
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED || 'true' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          # Configuration Ntfy (Optionnel)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python main.py check

      - name: Sauvegarde de l'état des stocks
        run: |
          git config --global user.name "SP-Bot Cloud Runner"
          git config --global user.email "sp-bot@github-actions.local"
          git add data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour état des stations [skip ci]" && git push)
