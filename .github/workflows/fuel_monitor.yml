name: Fuel Monitor 24-7

on:
  schedule:
    # Exécution automatique de secours par le cron GitHub
    - cron: '*/5 * * * *'
  # Permet également de lancer manuellement depuis l'interface GitHub ou via API
  workflow_dispatch:
  repository_dispatch:
    types: [check-fuel]

# Une seule vérification à la fois, jamais interrompue : annuler un passage entre l'envoi d'une
# alerte et la sauvegarde de l'état provoquerait un doublon au passage suivant.
concurrency:
  group: fuel-monitor
  cancel-in-progress: false

jobs:
  check-fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vérification des stations et envoi alerte Ntfy
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python -u main.py check

      # Toujours exécutée, même si la vérification a échoué : l'état contient la file des alertes à retenter
      - name: Sauvegarde de l'état des stocks
        if: always()
        run: |
          git config --global user.name "SP-Bot Cloud Runner"
          git config --global user.email "sp-bot@github-actions.local"
          if [ -z "$(git status --porcelain data/state.json)" ]; then
            echo "Aucun changement d'état à archiver."
            exit 0
          fi
          cp data/state.json "$RUNNER_TEMP/state.json"
          for attempt in 1 2 3 4; do
            git add data/state.json
            git commit -q -m "Mise à jour état des stations [skip ci]"
            if git push -q origin HEAD:${{ github.ref_name }}; then
              echo "État archivé."
              exit 0
            fi
            # Le dépôt a avancé entre-temps (push manuel) : on se recale dessus et on réapplique notre état
            echo "Push refusé (tentative $attempt), resynchronisation..."
            sleep $((attempt * 3))
            git fetch -q --depth=1 origin ${{ github.ref_name }}
            git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/state.json" data/state.json
            if [ -z "$(git status --porcelain data/state.json)" ]; then exit 0; fi
          done
          echo "::error::Impossible d'archiver data/state.json : risque d'alerte en double au prochain passage."
          exit 1
